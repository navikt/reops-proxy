name: Deploy to gcp

on:
  push:
    branches: [ master ]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  build:
    name: Build and push docker container
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: 'Build and push'
        uses: nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: team-researchops
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}

    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

  build-prod-rebuild:
    name: Rebuild last prod release on fresh base image
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve latest prod tag
        id: tag
        run: |
          TAG="$(git tag -l 'prod-*' --sort=-creatordate | head -n 1)"
          if [ -z "$TAG" ]; then
            echo "::error ::No prod-* tag found"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-list -n 1 "$TAG")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - name: 'Build and push'
        uses: nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: team-researchops
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          no_cache: true

    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}

  deploy-dev:
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    name: Deploy to dev-gcp
    needs: build
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
      - name: Generate nais variables
        run: |
          cat > .nais/dev-vars.yaml <<EOF
          SITEIMPROVE: ${{ secrets.SITEIMPROVE }}
          REOPS: ${{ secrets.REOPS }}
          EOF
      - name: Deploy to dev
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/dev-gcp.yaml
          VAR: image=${{ needs.build.outputs.image }},version=${{ github.sha }}
          VARS: .nais/dev-vars.yaml

  deploy-prod:
    if: ${{ !cancelled() && needs.build.result == 'success' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod') || (github.event_name == 'schedule' && needs.build-prod-rebuild.result == 'success')) }}
    name: Deploy to prod-gcp
    needs: [build, build-prod-rebuild]
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-prod-rebuild.outputs.tag || github.sha }}
      - name: Generate nais variables
        run: |
          cat > .nais/prod-vars.yaml <<EOF
          SITEIMPROVE: ${{ secrets.SITEIMPROVE }}
          REOPS: ${{ secrets.REOPS }}
          EOF
      - name: Deploy to prod
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/prod-gcp.yaml
          VAR: image=${{ needs.build-prod-rebuild.outputs.image || needs.build.outputs.image }},version=${{ needs.build-prod-rebuild.outputs.sha || github.sha }}
          VARS: .nais/prod-vars.yaml
      - name: "Create deployment tag"
        if: success() && github.event_name != 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="prod-$(date -u +'%Y.%m.%d-%H%M%S')"
          git tag -a "$TAG_NAME" -m "Production deployment of ${{ github.sha }}"
          git push origin "$TAG_NAME"
