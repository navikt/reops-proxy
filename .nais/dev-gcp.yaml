apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: reops-proxy
  namespace: team-researchops
  labels:
    team: team-researchops
spec:
  image: {{ image }}
  port: 8080
  resources:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  accessPolicy:
    inbound:
      rules:
        - application: arbeidsgiver-datafortelling
          namespace: arbeidsgiver-data
        - application: memu-data
          namespace: fugl-fonix
        - application: umami-start
    outbound:
      external:
        - host: api.siteimprove.com
        - host: api.eu.siteimprove.com
        - host: siteimprove.com
        - host: nav.no
        - host: raw.githubusercontent.com
        - host: bigquery.googleapis.com
        - host: oauth2.googleapis.com
  ingresses:
    - https://reops-proxy.intern.dev.nav.no
    - https://reops-proxy.ansatt.dev.nav.no
    # Non-SSO ingress for server-to-server calls (Innblikk local dev). Token-gated by bigquery.js.
    - https://reops-proxy.dev.nav.no
  liveness:
    path: /isAlive
    initialDelay: 20
  readiness:
    path: /isReady
    initialDelay: 20
  # Dev-only guarded BigQuery passthrough — see bigquery.js. Never mount these in prod.
  envFrom:
    - secret: umami-bigquery
    - secret: innblikk-dev-local-token
  env:
    - name: SITEIMPROVE
      value: {{SITEIMPROVE}}
    - name: REOPS
      value: {{REOPS}}
    - name: GCP_PROJECT_ID
      value: "team-researchops-dev-4396"
    - name: NAIS_CLUSTER_NAME
      value: "dev-gcp"